
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szelesdomb FM – Élő rádió</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 65px 20px 40px;
  background: linear-gradient(135deg, #350000, #111);
  border-bottom: 2px solid #e32636;
}

.logo {
  font-size: 46px;
  font-weight: 900;
  letter-spacing: 4px;
}

.logo span { color: #e32636; }

.live {
  color: #ff4545;
  margin-top: 15px;
  font-size: 13px;
  letter-spacing: 3px;
}

main {
  max-width: 650px;
  margin: 55px auto;
  padding: 20px;
}

.player {
  background: #1d1d1d;
  border: 1px solid #383838;
  border-radius: 18px;
  padding: 35px 20px;
}

.player p { color: #aaa; }

footer {
  color: #777;
  padding: 30px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">SZELESDOMB <span>FM</span></div>
  <div class="live">● ÉLŐ ADÁS</div>
</header>

<main>
  <div class="player">
    <h2>Hallgasd élőben!</h2>
    <p>Szelesdomb FM – Online rádió</p>

    <!-- A RÁDIÓLEJÁTSZÓ KÓDJA IDE KERÜL -->

    <p>Hamarosan indul az adás...</p>
  </div>
</main>

<footer>
  © 2026 Szelesdomb FM – Minden jog fenntartva.
</footer>

</body>
</html>
